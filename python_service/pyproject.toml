[project]
name = "python-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=7.2.0",
    "chromadb>=1.5.9",
    "email-validator>=2.0.0",
    "fastapi>=0.139.0",
    "google-genai>=2.23.0",
    "groq>=0.11.0",
    "langchain-core>=1.4.8",
    "langchain-text-splitters>=1.1.2",
    "openai>=1.30.0",
    "psycopg2-binary>=2.9.0",
    "pydantic-settings>=2.14.1",
    "pymupdf>=1.28.0",
    "python-docx>=1.2.0",
    "pyvi>=0.1.1",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "supabase>=2.31.0",
    "uvicorn>=0.49.0",
]

[tool.setuptools.packages.find]
include = ["app*", "api*", "core*", "service*", "knowledge_base*"]
exclude = ["data*", "logs*"]

[tool.uv]
# onnxruntime >=1.20 dropped macOS x86_64 wheels; pin for Intel Macs
constraint-dependencies = [
    "onnxruntime<1.20; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
